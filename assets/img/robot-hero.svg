<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" fill="none" font-family="JetBrains Mono, ui-monospace, monospace">
  <!-- Placeholder line art. Replace with a real photo/render once the robot is built. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8ff2e"/>
      <stop offset="1" stop-color="#3ad6ff"/>
    </linearGradient>
  </defs>

  <!-- floor -->
  <line x1="10" y1="400" x2="510" y2="400" stroke="#353c4a" stroke-width="2"/>
  <g stroke="#262b36" stroke-width="1.5">
    <line x1="20" y1="400" x2="8" y2="414"/><line x1="60" y1="400" x2="48" y2="414"/><line x1="100" y1="400" x2="88" y2="414"/>
    <line x1="140" y1="400" x2="128" y2="414"/><line x1="180" y1="400" x2="168" y2="414"/><line x1="220" y1="400" x2="208" y2="414"/>
    <line x1="260" y1="400" x2="248" y2="414"/><line x1="300" y1="400" x2="288" y2="414"/><line x1="340" y1="400" x2="328" y2="414"/>
    <line x1="380" y1="400" x2="368" y2="414"/><line x1="420" y1="400" x2="408" y2="414"/><line x1="460" y1="400" x2="448" y2="414"/>
    <line x1="500" y1="400" x2="488" y2="414"/>
  </g>

  <!-- camera field of view -->
  <path d="M232 170 L40 400 L210 400 Z" fill="#3ad6ff" fill-opacity="0.05"/>
  <path d="M232 170 L40 400 M232 170 L210 400" stroke="#3ad6ff" stroke-opacity="0.45" stroke-dasharray="4 6"/>

  <!-- TurtleBot3 Burger -->
  <g stroke="#8790a0" stroke-width="2">
    <rect x="240" y="352" width="160" height="9" rx="2" fill="#14171e"/>
    <rect x="240" y="292" width="160" height="9" rx="2" fill="#14171e"/>
    <rect x="240" y="232" width="160" height="9" rx="2" fill="#14171e"/>
    <line x1="252" y1="241" x2="252" y2="292"/><line x1="388" y1="241" x2="388" y2="292"/>
    <line x1="252" y1="301" x2="252" y2="352"/><line x1="388" y1="301" x2="388" y2="352"/>
    <rect x="285" y="200" width="78" height="32" rx="6" fill="#1b1f28"/>
    <line x1="295" y1="216" x2="353" y2="216" stroke="#3ad6ff" stroke-opacity="0.6"/>
    <rect x="270" y="310" width="100" height="30" rx="3" fill="#1b1f28"/>
    <circle cx="300" cy="368" r="32" fill="#0f1116"/>
    <circle cx="300" cy="368" r="12"/>
    <circle cx="384" cy="392" r="8"/>
  </g>

  <!-- camera on mast -->
  <line x1="246" y1="232" x2="246" y2="176" stroke="#8790a0" stroke-width="2"/>
  <rect x="226" y="160" width="34" height="20" rx="4" fill="#1b1f28" stroke="#3ad6ff" stroke-width="2"/>
  <circle cx="234" cy="170" r="5" fill="#3ad6ff"/>

  <!-- arm mount + SO-101 -->
  <rect x="200" y="296" width="44" height="10" fill="#262b36"/>
  <rect x="186" y="290" width="36" height="58" rx="5" fill="#14171e" stroke="url(#g)" stroke-width="2.5"/>
  <g stroke="url(#g)" stroke-width="13" stroke-linecap="round">
    <line x1="204" y1="290" x2="128" y2="206"/>
    <line x1="128" y1="206" x2="72" y2="300"/>
  </g>
  <line x1="72" y1="300" x2="72" y2="346" stroke="#c8ff2e" stroke-width="7" stroke-linecap="round"/>
  <path d="M52 346 H92 M52 346 V368 M92 346 V368" stroke="#c8ff2e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#0a0b0e" stroke="#3ad6ff" stroke-width="3">
    <circle cx="204" cy="290" r="9"/><circle cx="128" cy="206" r="9"/><circle cx="72" cy="300" r="8"/>
  </g>

  <!-- target object + detection box -->
  <rect x="56" y="372" width="32" height="28" rx="3" fill="#ff5c5c" fill-opacity="0.85"/>
  <rect x="44" y="360" width="56" height="48" stroke="#c8ff2e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="44" y="343" width="70" height="16" fill="#c8ff2e"/>
  <text x="48" y="355" font-size="10" fill="#0a0b0e" font-weight="700">object 0.94</text>

  <!-- callouts -->
  <g font-size="11" fill="#8790a0">
    <text x="150" y="160">SO-101 arm</text>
    <line x1="150" y1="166" x2="140" y2="192" stroke="#353c4a"/>
    <text x="300" y="150">LiDAR</text>
    <line x1="318" y1="156" x2="322" y2="198" stroke="#353c4a"/>
    <text x="190" y="128">camera</text>
    <line x1="214" y1="134" x2="236" y2="158" stroke="#353c4a"/>
    <text x="410" y="300">TurtleBot3</text>
    <line x1="408" y1="296" x2="392" y2="296" stroke="#353c4a"/>
  </g>
</svg>
